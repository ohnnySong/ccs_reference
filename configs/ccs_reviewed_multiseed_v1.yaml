schema_version: ccs.reviewed-multiseed.config.v1

data:
  total_records: 954
  training_records: 777
  validation_records: 177
  split_seed: 877
  patient_overlap: 0
  eye_overlap: 0
  reviewed_records: 23
  changed_label_records: 13
  reviewed_patient_groups_forced_to_train: 22
  test_accessed: false

image:
  input_size: [320, 320]
  color_mode: RGB
  resize: preserve_aspect_ratio_with_black_padding
  burned_in_text_mask:
    width_fraction: 0.35
    height_fraction: 0.06
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

encoder:
  architecture: convnext_tiny
  initialization: torchvision_imagenet1k_then_ccs_transfer
  frozen: true
  opacity_feature_width: 2304
  area_feature_width: 768

opacity_head:
  classes: [opacity_0, opacity_1, opacity_2, opacity_3]
  hidden_width: 128
  dropout: 0.55
  optimizer: AdamW
  learning_rate: 0.0001
  minimum_learning_rate: 0.000005
  weight_decay: 0.10
  batch_size: 32
  max_epochs: 200
  early_stopping_patience: 25
  label_smoothing: 0.08
  ordinal_loss_weight: 0.20
  feature_noise_std: 0.025
  mixup_probability: 0.50
  mixup_lambda_range: [0.65, 0.85]
  selection_score: 0.70_macro_f1_plus_0.30_balanced_accuracy

reviewed_label_finetune:
  optimizer: AdamW
  learning_rate: 0.00002
  minimum_learning_rate: 0.000001
  weight_decay: 0.10
  max_epochs: 120
  early_stopping_patience: 20
  label_smoothing: 0.06
  ordinal_loss_weight: 0.15
  feature_noise_std: 0.015
  mixup_probability: 0.35
  mixup_lambda_range: [0.70, 0.90]
  rollback_protection: true

area_head:
  output: opening_area_mm2
  formula: predicted_fraction_times_wtw_mm_squared
  hidden_width: 192
  dropout: 0.50
  optimizer: AdamW
  learning_rate: 0.00005
  minimum_learning_rate: 0.0000025
  weight_decay: 0.10
  batch_size: 32
  max_epochs: 250
  early_stopping_patience: 30
  feature_noise_std: 0.01
  boundary_thresholds_mm2: [16.0, 20.0]
  boundary_loss_weight: 0.10

evaluation:
  seeds: [20260927, 20260928, 20260929, 20260930, 20261001]
  contraction_rule:
    class_0: area_gt_20
    class_1: 16_lt_area_lte_20
    class_2_or_3: area_lte_16
  final_ccs_rule:
    negative: opacity_ne_3_or_area_gt_20
    mild_positive: opacity_eq_3_and_16_lt_area_lte_20
    severe_positive: opacity_eq_3_and_area_lte_16
